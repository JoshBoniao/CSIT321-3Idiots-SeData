spring.application.name=sedata
server.port=8080

# ===============================================
# MySQL Database Connection (XAMPP / Local MySQL)
# ===============================================
# Default database name: sedata (Create this database in phpMyAdmin: http://localhost/phpmyadmin)
spring.datasource.url=jdbc:mysql://localhost:3306/sedata?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# Default password for XAMPP root user is empty (blank). If you set a password, enter it below.
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================================
# JPA / Hibernate Configuration
# ===============================================
# 'update' automatically creates or modifies database tables to match your Java entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
